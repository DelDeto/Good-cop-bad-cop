name: Game regression and UI gates

on:
  pull_request:
    branches: [main, feature/v1.6-sprint-01]
  push:
    branches: [main, feature/v1.6-sprint-01, feature/v1.7-responsive-table, feature/v1.8-premium-release]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sprint01-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    name: Node ${{ matrix.node }} / regression and privacy
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
      # No external runtime dependencies and no lockfile: npm install is unnecessary.
      - name: Full regressions including privacy and HTTP SSE
        run: node scripts/ci-run.mjs npm test
      - name: Repeat entire regression suite five times (never retry failures away)
        run: node scripts/repeat-tests.mjs 5 /tmp/gcbc-ci-repeat
      - name: Verify generated Cloudflare assets
        run: npm run assets:check
      - name: Final original artwork inventory and integrity
        run: npm run art:check
      - name: Actual server entrypoint smoke
        run: node scripts/local-smoke.mjs
      - name: Preserve repeated regression evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: node-${{ matrix.node }}-regression-evidence
          path: /tmp/gcbc-ci-repeat/
          if-no-files-found: warn
          retention-days: 90

  browser:
    name: Chromium / viewport and gameplay
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - name: Install isolated QA tool (no application dependencies)
        run: npm install --prefix "$RUNNER_TEMP/gcbc-browser" --no-package-lock --no-save playwright-core@1.57.0
      - name: Chromium geometry and gameplay fixtures
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/gcbc-browser/node_modules/playwright-core/index.mjs
          CHROMIUM_PATH: /usr/bin/google-chrome
          QA_OUTPUT_DIR: file://${{ runner.temp }}/gcbc-ui-evidence/
        run: node scripts/ci-run.mjs node scripts/qa-v17.mjs
      - name: V1.8.2 fixed-state visual hierarchy, privacy, contrast and equipment audit
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/gcbc-browser/node_modules/playwright-core/index.mjs
          CHROMIUM_PATH: /usr/bin/google-chrome
          V182_OUTPUT_DIR: ${{ runner.temp }}/gcbc-ui-evidence/v182
        run: |
          node scripts/ci-run.mjs node scripts/qa-v182.mjs
          node scripts/compare-v182.mjs "$V182_OUTPUT_DIR/results.json"
      - name: Actual multiplayer and solo server integration
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/gcbc-browser/node_modules/playwright-core/index.mjs
          CHROMIUM_PATH: /usr/bin/google-chrome
          QA_OUTPUT_DIR: file://${{ runner.temp }}/gcbc-ui-evidence/
        run: node scripts/ci-run.mjs node scripts/qa-v17-real.mjs
      - name: Rehearse the exact production browser verifier on the local server
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/gcbc-browser/node_modules/playwright-core/index.mjs
          CHROMIUM_PATH: /usr/bin/google-chrome
          RELEASE_OUTPUT_DIR: ${{ runner.temp }}/gcbc-ui-evidence/rehearsal
        run: node scripts/ci-run.mjs node scripts/qa-production-verifier.mjs
      - name: Upload visual QA evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: v18-chromium-evidence
          path: ${{ runner.temp }}/gcbc-ui-evidence/
          if-no-files-found: warn
